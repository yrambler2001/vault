[build]
  base = "frontend"
  command = "sed -i s%API_SERVER_PLACEHOLDER%${API_SERVER}%g ../netlify.toml && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "API_SERVER_PLACEHOLDER/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "publickey-credentials-get=(self)"